<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejseuge-test · London program</title>
<style>
:root{--ink:#1A2433;--muted:#6B7280;--line:#E5DDD2;--paper:#F5F0E8;--accent:#A06A2C}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink)}
.testbar{position:sticky;top:0;z-index:50;background:rgba(245,240,232,.98);border-bottom:1px solid var(--line);padding:10px 12px;box-shadow:0 10px 24px rgba(26,36,51,.08)}
.testbar h1{font-size:16px;margin:0 0 3px;letter-spacing:-.01em}.testbar p{margin:0 0 8px;color:var(--muted);font-size:12.5px}.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800;color:#3F4854;white-space:nowrap}.chips button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.status{margin-top:8px;font-size:12.5px;color:#3F4854;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px}.framewrap{height:calc(100vh - 132px);background:#fff}.framewrap iframe{width:100%;height:100%;border:0;display:block;background:#fff}@media(min-width:700px){.testbar{padding-left:18px;padding-right:18px}.framewrap{height:calc(100vh - 124px)}}
</style>
</head>
<body>
<div class="testbar">
  <h1>Rejseuge-test</h1>
  <p>Test hvordan live-programmet opfører sig, som om det var en bestemt dag. Dette ændrer ikke den rigtige side.</p>
  <div class="chips">
    <button data-mode="pre">Før rejsen</button>
    <button data-mode="d10">Fre 10/7</button>
    <button data-mode="d13">Man 13/7</button>
    <button data-mode="d15">Ons 15/7</button>
    <button data-mode="post">Efter rejsen</button>
  </div>
  <div class="status" id="status">Indlæser testside…</div>
</div>
<div class="framewrap"><iframe id="program" src="./index.html?v=travel-test"></iframe></div>
<script>
const dayMeta = [
  {id:'d10', label:'Fredag 10/7', date:'2026-07-10'},
  {id:'d11', label:'Lørdag 11/7', date:'2026-07-11'},
  {id:'d12', label:'Søndag 12/7', date:'2026-07-12'},
  {id:'d13', label:'Mandag 13/7', date:'2026-07-13'},
  {id:'d14', label:'Tirsdag 14/7', date:'2026-07-14'},
  {id:'d15', label:'Onsdag 15/7', date:'2026-07-15'},
  {id:'d16', label:'Torsdag 16/7', date:'2026-07-16'}
];
const simDates = {pre:'2026-07-09', d10:'2026-07-10', d13:'2026-07-13', d15:'2026-07-15', post:'2026-07-17'};
const descriptions = {
  pre:'Før rejsen: siden åbner på Overblik. Ingen dage dæmpes endnu.',
  d10:'Fredag 10/7: siden åbner på fredag. Fredag markeres som I dag.',
  d13:'Mandag 13/7: siden åbner på mandag. Fredag–søndag dæmpes som overståede.',
  d15:'Onsdag 15/7: siden åbner på onsdag. Tidligere dage dæmpes, onsdag markeres som I dag.',
  post:'Efter rejsen: siden åbner på Overblik, og alle rejsedage dæmpes som overståede.'
};
const iframe = document.getElementById('program');
const statusEl = document.getElementById('status');
let currentMode = 'd13';
function cmp(a,b){ return new Date(a+'T12:00:00') - new Date(b+'T12:00:00'); }
function injectStyles(doc){
  if(doc.getElementById('travel-test-style')) return;
  const style = doc.createElement('style');
  style.id = 'travel-test-style';
  style.textContent = `
    .overview-card.is-past{opacity:.50;filter:saturate(.55);background:#f8f5ef!important;}
    .overview-card.is-today{outline:3px solid #A06A2C;box-shadow:0 0 0 6px rgba(160,106,44,.14),0 10px 26px rgba(26,36,51,.10)!important;background:#fffaf2!important;}
    .nav button.today-nav{background:#A06A2C!important;color:#fff!important;border-color:#A06A2C!important;}
    .nav button.past-nav{opacity:.55;}
    .travel-state{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;margin-left:6px;background:#f8ecd9;color:#A06A2C;}
    .travel-state.past{background:#eee9df;color:#6B7280;}
    .travel-ribbon{display:inline-flex;margin-top:10px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;background:rgba(255,255,255,.20);color:#fff;border:1px solid rgba(255,255,255,.35);}
  `;
  doc.head.appendChild(style);
}
function resetMarkers(doc){
  doc.querySelectorAll('.is-past,.is-today,.past-nav,.today-nav').forEach(el=>el.classList.remove('is-past','is-today','past-nav','today-nav'));
  doc.querySelectorAll('.travel-state,.travel-ribbon').forEach(el=>el.remove());
}
function idFromOverviewCard(card){
  const oc = card.getAttribute('onclick') || '';
  const m = oc.match(/show\('([^']+)'\)/);
  return m ? m[1] : null;
}
function addBadge(doc, card, text, cls){
  const line = card.querySelector('.badgeline') || card;
  const s = doc.createElement('span');
  s.className = 'travel-state ' + (cls || '');
  s.textContent = text;
  line.appendChild(s);
}
function addRibbon(doc, id, text){
  const hero = doc.querySelector('#'+id+' .day-hero');
  if(!hero) return;
  const r = doc.createElement('div');
  r.className = 'travel-ribbon';
  r.textContent = text;
  hero.appendChild(r);
}
function applyMode(mode){
  currentMode = mode;
  document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  statusEl.textContent = descriptions[mode] || '';
  const doc = iframe.contentDocument;
  const win = iframe.contentWindow;
  if(!doc || !win) return;
  injectStyles(doc);
  resetMarkers(doc);
  const simDate = simDates[mode];
  let today = dayMeta.find(d=>d.date===simDate);
  const beforeTrip = cmp(simDate, dayMeta[0].date) < 0;
  const afterTrip = cmp(simDate, dayMeta[dayMeta.length-1].date) > 0;
  doc.querySelectorAll('.overview-card').forEach(card=>{
    const id = idFromOverviewCard(card);
    const day = dayMeta.find(d=>d.id===id);
    if(!day) return;
    if(today && id === today.id){ card.classList.add('is-today'); addBadge(doc, card, 'I dag', 'today'); }
    else if(!beforeTrip && cmp(day.date, simDate) < 0){ card.classList.add('is-past'); addBadge(doc, card, 'Gået', 'past'); }
    else if(afterTrip){ card.classList.add('is-past'); addBadge(doc, card, 'Gået', 'past'); }
  });
  doc.querySelectorAll('.nav button').forEach(btn=>{
    const id = btn.dataset.id;
    const day = dayMeta.find(d=>d.id===id);
    if(!day) return;
    if(today && id===today.id) btn.classList.add('today-nav');
    else if(!beforeTrip && cmp(day.date, simDate) < 0) btn.classList.add('past-nav');
    else if(afterTrip) btn.classList.add('past-nav');
  });
  if(today){ addRibbon(doc, today.id, 'I dag · '+today.label); win.show(today.id); }
  else { win.show('overblik'); }
}
iframe.addEventListener('load',()=>setTimeout(()=>applyMode(currentMode),250));
document.querySelectorAll('.chips button').forEach(btn=>btn.addEventListener('click',()=>applyMode(btn.dataset.mode)));
</script>
</body>
</html>
