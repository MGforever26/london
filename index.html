<title>London program</title>
<style>
:root{--ink:#162033;--muted:#667085;--line:#e7e1d8;--blue:#2f6fed;--blue-soft:#eaf1ff;--amber:#b66a00;--amber-soft:#fff4df;--shadow:0 14px 34px rgba(30,41,59,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#f4efe8,#fff 540px);color:var(--ink);line-height:1.42}a{color:inherit}.header{padding:24px 16px 18px;max-width:980px;margin:auto}.header h1{font-size:39px;line-height:1;margin:0 0 8px;letter-spacing:-.045em}.header p{margin:0;color:var(--muted);font-size:15px}.updated{display:inline-flex;margin-top:14px;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.nav{background:transparent;padding:8px 12px 4px;overflow-x:auto;white-space:nowrap}.nav-inner{max-width:980px;margin:auto;display:flex;gap:8px;padding-bottom:4px}.nav button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;font-size:13px;font-weight:750;color:#344054}.nav button.active{background:#162033;color:#fff;border-color:#162033}main{max-width:980px;margin:auto;padding:16px 12px 60px}.section{display:none}.section.active{display:block}.section-title{font-size:24px;letter-spacing:-.025em;margin:22px 2px 12px}.overview-grid{display:grid;grid-template-columns:1fr;gap:11px}.overview-card{position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px 14px 14px 17px;box-shadow:0 8px 22px rgba(30,41,59,.055);overflow:hidden;text-align:left;width:100%;font:inherit;color:inherit}.overview-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:#2f6fed}.overview-card:nth-child(2):before{background:#1f8a5b}.overview-card:nth-child(3):before{background:#7357d1}.overview-card:nth-child(4):before{background:#b66a00}.overview-card:nth-child(5):before{background:#1683a9}.overview-card:nth-child(6):before{background:#b54763}.overview-card:nth-child(7):before{background:#667085}.date-mini{grid-row:1 / span 3;min-width:72px;background:#f7f3ed;border:1px solid var(--line);border-radius:15px;padding:8px 9px;text-align:center;line-height:1.15;color:#344054;text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:850}.overview-card h3{margin:0 0 3px;font-size:17px;letter-spacing:-.012em}.overview-card p{margin:0;color:var(--muted);font-size:12.8px}.badgeline{grid-column:2;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}.smallbadge,.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850;white-space:nowrap}.booked{background:var(--blue-soft);color:#174ea6}.todo{background:var(--amber-soft);color:var(--amber)}.day-hero{color:#fff;border-radius:28px;padding:19px 18px;box-shadow:var(--shadow);margin-top:4px}.day-hero .kicker{color:rgba(255,255,255,.70);text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:850}.day-hero h2{font-size:36px;line-height:1.02;letter-spacing:-.045em;margin:7px 0 6px}.day-hero p{margin:0;color:rgba(255,255,255,.80)}.d10 .day-hero{background:linear-gradient(135deg,#17324d,#2f6fed)}.d11 .day-hero{background:linear-gradient(135deg,#173f33,#1f8a5b)}.d12 .day-hero{background:linear-gradient(135deg,#2f255d,#7357d1)}.d13 .day-hero{background:linear-gradient(135deg,#553100,#b66a00)}.d14 .day-hero{background:linear-gradient(135deg,#15324a,#1683a9)}.d15 .day-hero{background:linear-gradient(135deg,#54223c,#b54763)}.d16 .day-hero{background:linear-gradient(135deg,#26364a,#667085)}.cards,.list-stack{display:grid;gap:12px;margin-top:12px}.event-card,.info-card,.list-card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:15px;box-shadow:0 8px 22px rgba(30,41,59,.055)}.event-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.time{display:inline-flex;background:var(--blue-soft);color:var(--blue);font-weight:850;border-radius:12px;padding:6px 9px;font-size:13px;margin-bottom:8px}.event-card h3,.info-card h3,.list-card h3{margin:0 0 6px;font-size:18px;letter-spacing:-.014em}.event-card p,.info-card p,.list-card p{font-size:13.5px;margin:8px 0;color:#344054}.event-card .maintext{font-size:14px;color:var(--ink)}.buttons,.list-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.buttons a,.list-actions a,.list-card>a{display:inline-flex;text-decoration:none;background:#f7f3ed;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;color:#344054}.list-card{display:flex;justify-content:space-between;gap:12px;align-items:center}.info-grid{display:grid;grid-template-columns:1fr;gap:12px}.toplink{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:99999;width:58px;height:58px;border-radius:999px;background:#162033;color:#fff;text-decoration:none;border:2px solid rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:950;box-shadow:0 16px 36px rgba(22,32,51,.36);line-height:1}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}@media(min-width:700px){.overview-grid,.info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toplink{bottom:32px}}@media(max-width:640px){.toplink{right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);width:56px;height:56px}}
</style>

<body>
<header class="header" id="top"><h1>London program</h1><p>10. juli til 16. juli</p><div class="updated">Sidst opdateret: 24. juni 2026</div></header>
<nav class="nav"><div class="nav-inner" id="nav"></div></nav><a class="toplink" href="#top" aria-label="Til toppen">↑</a><main id="main"></main>
<script>
const links={tower:'https://www.hrp.org.uk/tower-of-london/visit/tickets-and-prices/',nhm:'https://www.nhm.ac.uk/visit.html',science:'https://www.sciencemuseum.org.uk/visit',wonder:'https://www.sciencemuseum.org.uk/see-and-do/wonderlab',hp:'https://www.wbstudiotour.co.uk/getting-here/',sky:'https://skygarden.london/booking/',tate:'https://www.tate.org.uk/visit/tate-modern',guard:'https://www.householddivision.org.uk/changing-the-guard-calendar',greenwich:'https://www.rmg.co.uk/plan-your-visit/tickets-prices',horizon:'https://horizon22.co.uk/book/',thames1:'https://www.thameslinkrailway.com/journey/gatwick-airport-to-london-bridge',thames2:'https://www.thameslinkrailway.com/journey/london-bridge-to-gatwick-airport',bus15:'https://tfl.gov.uk/bus/route/15/'};
function map(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
const days=[
{id:'d10',date:'Fredag 10. juli',title:'Ankomst og rolig aftentur ved Themsen',c:'d10',items:[['Eftermiddag','Ankomst til London','Fly København 13.55 til Gatwick 14.55. Thameslink fra Gatwick Airport til London Bridge. Derfra ca. 12 til 15 minutters gang eller kort taxa til hotellet.','Thameslink fra Gatwick Airport til London Bridge. Gå eller tag kort taxa det sidste stykke.','Rolig ankomstdag uden tung aktivitet.',[['Thameslink',links.thames1],['Hotel',map('Premier Inn London Tower Bridge')]]],['Aften','Rolig aftentur ved Tower Bridge','Gå fra hotellet mod Tower Bridge, Themsen og eventuelt St Katharine Docks.','Alt kan klares til fods fra hotellet.','God første London-fornemmelse tæt på hotellet.',[['Kort',map('Tower Bridge London')]]]]},
{id:'d11',date:'Lørdag 11. juli',title:'Tower, Tower Bridge og South Bank',c:'d11',items:[['Formiddag','Tower of London','Tower of London ligger tæt på hotellet og fungerer bedst tidligt på dagen.','Gå fra hotellet.','Book på forhånd, gerne til ca. 10.00 eller 10.30. I travle perioder anbefales online booking på forhånd.',[['Billetter',links.tower],['Kort',map('Tower of London')]],'Skal bookes'],['Eftermiddag','Tower Bridge, HMS Belfast udefra, Borough Market og South Bank','Tower Bridge kan opleves ved at gå over den. HMS Belfast ses udefra. The Shard ses naturligt i området.','Alt kan klares til fods.','HMS Belfast giver mest mening udefra i dette program.',[['Kort',map('Borough Market London')]]],['Aften','Rolig middag tæt på hotellet','Middag omkring Bermondsey Street, London Bridge eller Tower Bridge-området.','Gåafstand fra hotellet.','Hold aftenen let efter første hele dag.']]},
{id:'d12',date:'Søndag 12. juli',title:'South Kensington, Natural History Museum og park',c:'d12',items:[['Formiddag','South Kensington','Museumsområdet med Natural History Museum, Science Museum og Victoria and Albert Museum tæt på hinanden.','Gå til London Bridge. Tag Jubilee Line til Westminster. Skift til District Line eller Circle Line til South Kensington.','Godt område at lande i før Natural History Museum.',[['Kort',map('South Kensington station London')]]],['12.00','Natural History Museum','Dagens hovedaktivitet.','Gå fra South Kensington station til museet.','Allerede booket.',[['Info',links.nhm],['Kort',map('Natural History Museum London')]],'Booket'],['Eftermiddag','Kensington Gardens/Hyde Park','Efter Natural History Museum giver det bedst mening med luft frem for mere museum.','Kensington Gardens/Hyde Park ligger i gåafstand fra Natural History Museum.','Hold eftermiddagen rolig. Wonderlab på Science Museum ligger i stedet som valgfrit punkt tirsdag eftermiddag.',[['Hyde Park',map('Hyde Park London')],['Kensington Gardens',map('Kensington Gardens London')]]]]},
{id:'d13',date:'Mandag 13. juli',title:'Bus 15 og Harry Potter',c:'d13',items:[['Formiddag','Billig sightseeing med bus 15','Rute 15 kan bruges som billig sightseeing fra Tower Hill mod Trafalgar Square/Charing Cross.','Gå eller tag kort transport til Tower Hill. Tag bus 15 mod Trafalgar Square/Charing Cross. Retur med bus eller Tube.','Der er ikke garanti for dobbeltdekker på hver afgang, men øverste dæk er bedst, hvis bussen er dobbeltdekker.',[['TfL rute 15',links.bus15]]],['Tidlig eftermiddag','Pause og let frokost','Luft inden Harry Potter.','Retur til hotellet eller området omkring London Bridge.','Hold pausen reel, så Harry Potter ikke starter med stress.'],['16.30','Harry Potter Studio Tour','Warner Bros. Studio Tour. Allerede booket.','Gå til London Bridge. Tag Northern Line til Euston. Tag tog til Watford Junction. Tag shuttlebus til Warner Bros. Studio Tour.','Afgang fra hotellet senest ca. 14.30. Shuttlebus fra Watford Junction tager ca. 15 minutter og kører mindst hver halve time.',[['Transport',links.hp],['Kort',map('Warner Bros Studio Tour London')]],'Booket']]},
{id:'d14',date:'Tirsdag 14. juli',title:'Sky Garden, South Bank eller Wonderlab og VM-semifinale',c:'d14',items:[['11.15','Sky Garden','Udsigt fra 20 Fenchurch Street.','Gå fra hotellet eller tag kort transport til Monument.','Booket. Adresse: 20 Fenchurch Street, London EC3M 8AF.',[['Booking',links.sky],['Kort',map('Sky Garden 20 Fenchurch Street London EC3M 8AF')]],'Booket'],['Eftermiddag','South Bank-ruten eller Wonderlab på Science Museum','Vælg efter energi: enten South Bank-ruten med Borough Market, Tate Modern og Millennium Bridge, eller 1-2 timer i Wonderlab på Science Museum.','South Bank klares til fods fra Sky Garden/Tower Bridge-området. Wonderlab kræver tur til South Kensington.','Science Museum har gratis adgang, men Wonderlab er en betalt interaktiv oplevelse med separat billet. Book Wonderlab online på forhånd, hvis det vælges; billetter på dagen kan ikke garanteres i travle perioder.',[['Tate Modern',links.tate],['Wonderlab',links.wonder],['Science Museum',links.science],['Kort',map('Science Museum London')]],'Skal bookes hvis valgt'],['Aften','VM semifinale 1 på pub','Gør det til aftensmad plus kamp.','Gå til pub i London Bridge, Bermondsey eller Tower Bridge-området.','Book bord, hvis muligt, især hvis England er med.']]},
{id:'d15',date:'Onsdag 15. juli',title:'Buckingham Palace, Westminster, Greenwich og Horizon 22',c:'d15',items:[['Formiddag','Changing the Guard ved Buckingham Palace','Ceremonien ligger normalt omkring kl. 11.00, men kalenderen skal tjekkes tættere på.','Gå til London Bridge. Tag Jubilee Line til Westminster. Gå via St James’s Park til Buckingham Palace.','Afgang fra hotellet omkring 09.45 til 10.00.',[['Kalender',links.guard],['Kort',map('Buckingham Palace London')]]],['Middag','St James’s Park, Westminster og enkel frokost','Big Ben og Westminster kan ses udefra uden at være en egentlig aktivitet.','Gå fra Buckingham Palace gennem St James’s Park mod Westminster.','Hold frokosten enkel.',[['Kort',map('Westminster London Big Ben')]]],['Eftermiddag','Greenwich, kort version','Greenwich er en roligere bydel ved floden med Greenwich Park, udsigt over London, National Maritime Museum og området ved Cutty Sark.','Fra Westminster: tag Jubilee Line til London Bridge, og tag tog fra London Bridge til Greenwich. Alternativt retur mod Tower Hill og DLR fra Tower Gateway til Cutty Sark.','Hold det som kort version, ikke fuldt museumsprogram.',[['Info',links.greenwich],['Kort',map('Cutty Sark Greenwich London')]]],['Sen eftermiddag','Horizon 22','Gratis udsigt fra 22 Bishopsgate.','Tag Tube eller gå videre mod 22 Bishopsgate, afhængigt af hvor dagen ender.','Skal bookes mandag 6. juli kl. 11.00 dansk tid. Gå efter kl. 15.30 eller 16.00.',[['Booking',links.horizon],['Kort',map('Horizon 22 22 Bishopsgate London')]],'Skal bookes'],['Aften','VM semifinale 2 på pub','Fleksibelt punkt.','Retur fra Greenwich til London Bridge eller Tower Gateway. Pub tæt på hotellet.','Hvis energien er der, kan det blive endnu en god kampaften.']]},
{id:'d16',date:'Torsdag 16. juli',title:'Sidste rolige stop og hjemrejse',c:'d16',items:[['Formiddag','Leadenhall Market, Tower Bridge-området eller sidste korte stop ved Themsen','Hold formiddagen tæt på hotellet og uden faste billetter.','Gå eller tag kort bus/Tube. Leadenhall Market ligger relativt tæt på hotellet og kan kombineres med en rolig sidste gåtur.','God dag til ikke at presse programmet.',[['Kort',map('Leadenhall Market London')]]],['Middag','Frokost og afhentning af bagage','Tæt på hotellet, London Bridge eller Borough Market.','Hold det tæt på hotellet.','Tjek om hotellet kan opbevare bagage efter check out.',[['Hotel',map('Premier Inn London Tower Bridge')]]],['Eftermiddag','Afgang mod Gatwick','Fly fra Gatwick kl. 19.05. Afgang fra hotellet omkring 15.30 til 16.00 giver god luft.','Gå eller tag kort taxa til London Bridge. Tag Thameslink fra London Bridge til Gatwick Airport.','London Bridge er nærmeste store station og bruges til Gatwick.',[['Thameslink',links.thames2]]],['Aften','Hjemrejse','Fly Gatwick 19.05 til København.','Ankomst København om aftenen.','Hold boarding og lufthavnstid enkelt. Ingen ekstra aktivitet efter ankomst til Gatwick.']]}];
const bookings=[['Natural History Museum','Søndag 12. juli kl. 12.00','Booket',links.nhm],['Harry Potter Studio Tour','Mandag 13. juli kl. 16.30','Booket',links.hp],['Sky Garden','Tirsdag 14. juli kl. 11.15','Booket',links.sky],['Wonderlab på Science Museum','Tirsdag 14. juli eftermiddag, hvis vi vælger det i stedet for South Bank-ruten','Valgfrit. Betalt billet. Book online på forhånd, hvis det vælges.',links.wonder],['Horizon 22','Onsdag 15. juli. Gå efter 15.30 eller 16.00','Skal bookes mandag 6. juli kl. 11.00 dansk tid',links.horizon],['Changing the Guard','Onsdag 15. juli ca. kl. 11.00','Tjek kalender tættere på',links.guard],['Tower of London','Lørdag 11. juli ca. 10.00 eller 10.30','Book på forhånd',links.tower]];
const practical=[['Hotel','Premier Inn London Tower Bridge. God base ved Tower Bridge, London Bridge, Themsen og Bermondsey.'],['Nærmeste store station','London Bridge. Bruges til Gatwick, Tube, tog mod Greenwich og adgang til resten af byen.'],['Gatwick til hotel','Tag Thameslink fra Gatwick Airport til London Bridge. Thameslink er almindeligt tognet, ikke Tube. Rejsetiden er typisk ca. 36 minutter, hurtigst ca. 29 minutter. Derfra ca. 12 til 15 minutters gang eller kort taxa til hotellet.'],['Hotel til Gatwick','Gå eller tag kort taxa til London Bridge. Tag Thameslink fra London Bridge til Gatwick Airport. Ved hjemrejse: fly fra Gatwick kl. 19.05 og afgang fra hotellet omkring 15.30 til 16.00.'],['Offentlig transport','Brug som udgangspunkt contactless/pay as you go for voksne. Hver voksen skal bruge sit eget kort eller sin egen telefon og bruge samme kort/enhed hele dagen, så dagsloftet virker korrekt.'],['Apps','Der er ikke behov for særlige apps til billettering. Google Maps eller Apple Maps er nok til de fleste ture. TfL Go kan bruges som supplement til ruteplanlægning.'],['Børn og transport','Barnet på 10 år kan rejse gratis med betalende voksen på TfL transport. Barnet på 12 år bør have Oyster eller Visitor Oyster med Young Visitor discount, som giver halv voksenpris i op til 14 dage.'],['Ugekort eller enkeltbilletter','Ugekort virker ikke nødvendigt. Brug pay as you go/contactless/Oyster, fordi dagsloftet begrænser udgiften. Zone 1 og 2 dagsloftet er £8,90 i 2026, og bus koster £1,75 pr. voksenrejse. Busser tager ikke kontanter.'],['Bus 15','Rute 15 kan bruges som billig sightseeing fra Tower Hill mod Trafalgar Square/Charing Cross. Der er ikke garanti for dobbeltdekker på hver afgang, men øverste dæk er bedst, hvis bussen er dobbeltdekker.']];
const alternatives=[['Covent Garden, Soho eller Piccadilly','Let at trække ind, hvis der er ekstra tid i centrum. Godt som stemningspunkt, ikke som tung attraktion.','https://www.visitlondon.com/things-to-do/place/276118-covent-garden',map('Covent Garden London')],['British Museum','Stor klassiker, men kan blive tungt. Bedst som kort stop, hvis vejret er dårligt eller der opstår museumstid.','https://www.britishmuseum.org/',map('British Museum London')],['Victoria and Albert Museum','Ligger tæt på Natural History Museum. Kun relevant hvis South Kensington-dagen kalder på mere museum.','https://www.vam.ac.uk/',map('Victoria and Albert Museum London')],['Camden Market','Sjovt og levende, men lidt ved siden af resten. Brug kun hvis der virkelig er lyst til marked og menneskemylder.','https://www.camdenmarket.com/',map('Camden Market London')],['Notting Hill og Portobello Road','Hyggeligt område, men ikke et must. Giver bedst mening som rolig formiddag, hvis andet falder væk.','https://www.visitportobello.com/',map('Portobello Road Market London')],['London Eye','Klassiker, men ikke nødvendig med Sky Garden og Horizon 22 i programmet.','https://www.londoneye.com/',map('London Eye')],['Regent’s Park','Godt grønt alternativ, hvis der er brug for luft og ro.','https://www.royalparks.org.uk/visit/parks/regents-park-primrose-hill',map('Regent\'s Park London')]];
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function btns(arr){return arr&&arr.length?'<div class="buttons">'+arr.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join('')+'</div>':''}
function badge(s){return s?`<span class="badge ${s==='Booket'?'booked':'todo'}">${esc(s)}</span>`:''}
function eventCard(it){return `<article class="event-card"><div class="event-head"><div><div class="time">${esc(it[0])}</div><h3>${esc(it[1])}</h3></div>${badge(it[6])}</div><p class="maintext">${esc(it[2])}</p><p><b>Transport:</b> ${esc(it[3])}</p><p><b>Bemærkning:</b> ${esc(it[4])}</p>${btns(it[5])}</article>`}
function show(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));document.getElementById('main').scrollIntoView({block:'start',behavior:'auto'})}
const navItems=[['overblik','Overblik'],...days.map(d=>[d.id,d.date.split(' ')[1]]),['bookinger','Bookinger'],['praktisk','Praktisk'],['alternativer','Alternativer']];
document.getElementById('nav').innerHTML=navItems.map(([id,t])=>`<button data-id="${id}" onclick="show('${id}')">${t}</button>`).join('');
let html=`<section id="overblik" class="section active"><h2 class="section-title">Overblik</h2><div class="overview-grid">${days.map(d=>`<button class="overview-card" onclick="show('${d.id}')"><div class="date-mini">${esc(d.date)}</div><div><h3>${esc(d.title)}</h3><p>${esc(d.items.slice(0,3).map(x=>x[0]+': '+x[1]).join(' · '))}</p><div class="badgeline">${d.items.some(x=>x[6]==='Booket')?'<span class="smallbadge booked">Booket</span>':''}${d.items.some(x=>x[6]&&x[6]!=='Booket')?'<span class="smallbadge todo">Skal bookes</span>':''}</div></div></button>`).join('')}</div></section>`;
html+=days.map(d=>`<section id="${d.id}" class="section ${d.c}"><div class="day-hero"><div class="kicker">Program</div><h2>${esc(d.date)}</h2><p>${esc(d.title)}</p></div><div class="cards">${d.items.map(eventCard).join('')}</div></section>`).join('');
html+=`<section id="bookinger" class="section"><h2 class="section-title">Bookinger og tjekpunkter</h2><div class="list-stack">${bookings.map(x=>`<article class="list-card"><div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><p><b>Status:</b> ${esc(x[2])}</p></div><a href="${x[3]}" target="_blank" rel="noopener">Link</a></article>`).join('')}</div></section>`;
html+=`<section id="praktisk" class="section"><h2 class="section-title">Praktisk info</h2><div class="info-grid">${practical.map(x=>`<article class="info-card"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></article>`).join('')}</div></section>`;
html+=`<section id="alternativer" class="section"><h2 class="section-title">Oplagte alternativer</h2><div class="list-stack">${alternatives.map(x=>`<article class="list-card"><div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div><div class="list-actions"><a href="${x[2]}" target="_blank" rel="noopener">Info</a><a href="${x[3]}" target="_blank" rel="noopener">Åbn kort</a></div></article>`).join('')}</div></section>`;
html+='<div class="footer">London program · mobilversion</div>';document.getElementById('main').innerHTML=html;document.querySelector('.nav button').classList.add('active');
</script></body></html>
