<!doctype html><html lang='da'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>London program</title><link rel='stylesheet' href='style.css'></head><body><header class='header' id='top'><h1>London program</h1><p>10. juli til 16. juli</p><div class='updated'>Sidst opdateret: 6. juli 2026</div></header><nav class='nav'><div class='nav-inner' id='nav'></div></nav><a class='toplink' href='#top' aria-label='Til toppen'>↑</a><main id='main'></main><script src='data.js'></script><script>(()=>{const D=window.LONDON_DATA;D.practical=D.practical.filter(x=>x[0]!=='Bus 15');const by=(arr,name)=>arr.find(x=>x[0]===name);const ns=by(D.practical,'Nærmeste store station');if(ns){ns[1]='London Bridge. Bruges til Gatwick, Tube, tog mod Greenwich og adgang til resten af byen. Efter ankomst går vi til London Bridge Underground og køber et almindeligt Oyster til den 12-årige. Kortet koster £10.50. Personalet lægger Young Visitor discount på, og vi fylder ca. £10 på først. Første udgift bliver dermed ca. £20.50: £10.50 for kortet plus ca. £10 i rejsekredit. Zone 1-2 er fint til de almindelige London-ture.';ns[2]=[['Oyster/top-up','tflOyster']];}const gat=by(D.practical,'Gatwick til hotel');if(gat){gat[1]='Tag Thameslink fra Gatwick Airport til London Bridge. Køb børnebilletter til begge børn i Gatwick. De voksne bruger contactless/pay as you go. Vi løser ikke Oyster til den 12-årige i Gatwick, fordi vi vil købe kortet og få Young Visitor discount lagt på i samme arbejdsgang ved London Bridge Underground. Uden rabatten ville den 12-årige rejse til voksenpris på Oyster/pay as you go. Rejsetiden er typisk ca. 36 minutter, hurtigst ca. 29 minutter. Derfra ca. 12 til 15 minutters gang eller kort taxa til hotellet.';}const p=by(D.practical,'Offentlig transport');if(p){p[1]=['Voksne bruger contactless/pay as you go. Hver voksen skal bruge sit eget kort eller sin egen telefon og samme kort/enhed hele dagen, så capping virker korrekt.','Den 10-årige rejser gratis med betalende voksen på TfL-transport i London.','Den 12-årige skal have et almindeligt Oyster uden foto. Det er ikke et Zip Oyster photocard, kræver ikke forudbestilling og kræver ikke pas/fotoansøgning.','Vi køber ikke Oyster i Gatwick, fordi vi vil købe kortet og få Young Visitor discount lagt på i samme arbejdsgang ved London Bridge Underground. Uden rabatten ville den 12-årige rejse til voksenpris på Oyster/pay as you go.','Oyster-kortet koster £10.50. Det er kortpris, ikke saldo. Første udgift bliver ca. £20.50, hvis vi fylder £10 på fra start.','Ved London Bridge Underground beder vi personalet lægge Young Visitor discount på kortet. Barnet skal være med. Rabatten giver 50 procent på voksen pay as you go og daglige lofter i op til 14 dage.','Det er nemt at toppe op senere i TfL Go, ved Oyster Ticket Stops og ved billetautomater på Tube, London Overground og de fleste Elizabeth line- og National Rail-stationer.','Rejser uden for zone 1-2 er ikke et problem med Oyster/pay as you go. De koster bare mere end zone 1-2 og kræver nok saldo på kortet.','Harry Potter/Watford er ikke et separat kortproblem. Den 12-åriges Oyster kan bruges Euston-Watford Junction, hvis kortet er tanket op.','Sammenligningen med ugekort skal læses sådan: Oyster-kortets £10.50 er en fast kortudgift. Derefter betaler vi kun faktisk rejseforbrug. Hvis vi i stedet vælger 7 Day Travelcard zone 1-2, skal det normalt lægges på et Oyster-kort, så kortudgiften på £10.50 kommer oven i Travelcard-prisen på £22.40. Samlet minimum bliver derfor ca. £32.90, før ekstra betaling/saldo til Gatwick og Watford/Harry Potter. Derfor kan ugekortet ikke betale sig i vores program.'];p[2]=[['Oyster/top-up','tflOyster'],['11-15-priser','tflChildFares']];}const fri=D.days.find(d=>d.id==='d10');if(fri){const it=fri.items[0];it[3]='Thameslink fra Gatwick Airport til London Bridge. I Gatwick løser vi kun børnenes togbilletter, ikke Oyster til den 12-årige. Ved London Bridge Underground køber vi et almindeligt Oyster til den 12-årige, får Young Visitor discount lagt på af personalet og fylder ca. £10 på.';it[4]='Oyster-kortet koster £10.50. Det er kortpris, ikke saldo. Første udgift bliver derfor ca. £20.50: £10.50 for kortet plus ca. £10 i rejsekredit. Vi venter til London Bridge, fordi rabatten lægges på dér; uden rabatten ville den 12-årige rejse til voksenpris på Oyster/pay as you go.';it[5]=[['Thameslink','thames1'],['Hotel','map:Premier Inn London Tower Bridge'],['Oyster','tflOyster']];}const mon=D.days.find(d=>d.id==='d13');if(mon){const b=mon.items[0];b[3]='Gå eller tag kort transport til Tower Hill. Tag bus 15 mod Trafalgar Square/Charing Cross. Betaling: voksne bruger contactless/pay as you go, den 12-årige bruger Oyster, og den 10-årige rejser gratis med betalende voksen.';b[4]='Der er ikke garanti for dobbeltdekker på hver afgang, men øverste dæk er bedst, hvis bussen er dobbeltdekker.';}})();</script><script src='app.js'></script></body></html>
